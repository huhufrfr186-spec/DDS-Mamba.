[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dds-mamba"
version = "0.1.0"
description = "DDS-Mamba visual tracking with decoupled position and appearance states"
requires-python = ">=3.10"
dependencies = ["torch>=2.2.2", "numpy>=1.26", "Pillow>=10.3"]

[project.scripts]
dds-mamba = "dds_mamba.cli:main"

[tool.setuptools.packages.find]
include = ["dds_mamba*"]
